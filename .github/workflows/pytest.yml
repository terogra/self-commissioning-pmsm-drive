name: Pytest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  firmware-parity:
    name: C99 compile and parity (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      PMSM_CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Strict C99 build, native assertions and Python/C parity
        run: python -m pytest -q tests/test_firmware_core.py
      - name: Reproduce generated configuration and quantitative evidence
        run: python -m experiments.firmware_parity --output "$RUNNER_TEMP/firmware_parity"
  engineering-app:
    name: Headless v1 application and demo
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Real backend and Streamlit AppTest (no browser)
        run: python -m pytest -q tests/test_engineering_workflow.py tests/test_engineering_app.py
      - name: One-command demonstration
        run: python -m experiments.v1_demo --output "$RUNNER_TEMP/v1_demo"
