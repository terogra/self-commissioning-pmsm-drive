name: Pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt system libraries for offscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-legacy.txt
      - run: python -m pytest -q
  firmware-parity:
    name: C99 compile and parity (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      PMSM_CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Strict C99 build, native assertions and Python/C parity
        run: python -m pytest -q tests/test_firmware_core.py
      - name: Reproduce generated configuration and quantitative evidence
        run: python -m experiments.firmware_parity --output "$RUNNER_TEMP/firmware_parity"
  engineering-app:
    # Keep the historical required-check name used by the main-branch ruleset.
    # The job itself now validates the native Qt application and deterministic demo.
    name: Headless v1 application and demo
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt system libraries for offscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements.txt
      - name: Real backend and native Qt (no browser)
        run: python -m pytest -q tests/test_engineering_workflow.py tests/test_engineering_app.py tests/test_desktop.py
      - name: One-command demonstration
        run: python -m experiments.v1_demo --output "$RUNNER_TEMP/v1_demo"
