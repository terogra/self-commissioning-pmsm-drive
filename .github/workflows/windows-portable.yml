name: Windows native desktop application

on:
  push:
    branches: [main]
    tags: ['v1.1.0']
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows-package:
    name: Windows x64 Qt build, native EXE, ZIP and SHA-256
    runs-on: windows-latest
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONUSERBASE: ${{ github.workspace }}/build/isolated-user-site
      QT_QPA_PLATFORM: offscreen
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-windows.txt
      - name: Install pinned Windows build inputs
        run: python -m pip install -r packaging/requirements-windows.txt
      - id: version
        name: Verify source version and tag
        shell: pwsh
        run: |
          $appVersion = python -c "from src.version import __version__; print(__version__)"
          "version=$appVersion" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne "v$appVersion") {
            throw "Tag does not match source version"
          }
      - name: Localization, native Qt, preservation and workflow tests (no Streamlit installed)
        run: python -m pytest -q tests/test_localization.py tests/test_windows_packaging.py tests/test_desktop.py tests/test_engineering_app.py tests/test_engineering_workflow.py
      - name: Build actual onedir executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --distpath dist --workpath build packaging/windows.spec 2>&1 | Tee-Object -FilePath package-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Initialize the actual packaged native Qt window
        run: python packaging/smoke_test.py --exe "dist/PMSM-Commissioning-Workbench/PMSM-Commissioning-Workbench.exe" --output package-diagnostics/build
      - name: Create ZIP and SHA-256 after runtime success
        run: python packaging/archive.py --directory "dist/PMSM-Commissioning-Workbench" --output portable-artifacts --version "${{ steps.version.outputs.version }}" --smoke-result package-diagnostics/build/smoke_result.json
      - name: Extract ZIP into a path with spaces and test again
        shell: pwsh
        run: |
          $extractedPath = Join-Path $env:RUNNER_TEMP 'PMSM extracted with spaces'
          Expand-Archive -LiteralPath "portable-artifacts/PMSM-Commissioning-Workbench-v${{ steps.version.outputs.version }}-Windows-x64.zip" -DestinationPath $extractedPath
          $appExe = Join-Path $extractedPath 'PMSM-Commissioning-Workbench/PMSM-Commissioning-Workbench.exe'
          python packaging/smoke_test.py --exe $appExe --output package-diagnostics/extracted
      - uses: actions/upload-artifact@v6
        with:
          name: PMSM-Commissioning-Workbench-v${{ steps.version.outputs.version }}-Windows-x64
          path: |
            portable-artifacts/*.zip
            portable-artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Collect application logs into workspace diagnostics
        if: always()
        shell: pwsh
        run: |
          $logPath = Join-Path $env:LOCALAPPDATA 'PMSMCommissioningWorkbench/logs/desktop.log'
          if (Test-Path -LiteralPath $logPath) {
            New-Item -ItemType Directory -Force -Path 'package-diagnostics/application' | Out-Null
            Copy-Item -LiteralPath $logPath -Destination 'package-diagnostics/application/desktop.log'
          }
      - name: Preserve startup/build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-runtime-diagnostics
          path: |
            package-build.log
            package-diagnostics/
          if-no-files-found: warn

  release-assets:
    name: Attach verified assets to an existing matching release
    needs: windows-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: PMSM-Commissioning-Workbench-v${{ needs.windows-package.outputs.version }}-Windows-x64
          path: portable-artifacts
      - name: Upload only to a release already created by the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" portable-artifacts/*.zip portable-artifacts/SHA256SUMS.txt --clobber
          else
            echo "No existing release; workflow artifacts retained. Publishing the matching release triggers verification and upload."
          fi
